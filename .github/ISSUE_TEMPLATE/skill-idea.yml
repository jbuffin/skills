name: Skill idea
description: Propose a new skill, or a change to what an existing one does.
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New skill
        - Change to an existing skill
    validations:
      required: true
  - type: input
    id: existing
    attributes:
      label: Existing skill
      description: Only for a change. Which skill?
  - type: textarea
    id: job
    attributes:
      label: The job
      description: What the agent should be able to do, as one narrow job. If it's two unrelated jobs, file two ideas.
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: When it should load
      description: The situation, or the words someone would type, that should make an agent pick this skill. This becomes the skill's description.
      placeholder: "When the user asks to ... / says \"...\""
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What an agent does now without the skill, and where that goes wrong.
    validations:
      required: true
  - type: dropdown
    id: shared-systems
    attributes:
      label: Does it change shared systems?
      description: Skills that push, post, deploy or file tickets run only when typed as `/<name>`.
      options:
        - "No, it only reads or changes local files"
        - "Yes, it pushes, posts, deploys or files things"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Skills elsewhere that come close (for example in mattpocock/skills), and why they don't fit.
