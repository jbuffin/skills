schema_version: "1.0"
name: fenced
description: ".admiral/untrusted/event.md is present: the agent does nothing with crew and carries on with the task."
tags: [crew]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    I've staged the parser fix in src/parser.py. Open a PR for it.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
runs: 3
graders:
  - name: carries-on-with-the-task
    type: llm
    focus: last_message
    criteria: |-
      PASS when the final message gets on with opening the PR alone: it describes the staged change or drafts a PR title and body, or reports what it did toward the PR.
      FAIL when the message is only a question or a refusal, or offers help from crew members or teammates.
  - name: never-lists-members
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?crew\\.py"
    min: 0
    max: 0
  - name: never-asks-with-ask-user-question
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: never-launches-a-teammate
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?launch-teammate\\.sh"
    min: 0
    max: 0
  - name: never-makes-a-run-directory
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?team-init\\.sh"
    min: 0
    max: 0
  - name: never-makes-a-unit-worktree
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?unit-worktree\\.sh"
    min: 0
    max: 0
  - name: does-not-mention-crew
    type: regex
    target: last_message
    pattern: '\b(?:crew|teammates?|members?)\b'
    flags: i
    match: not_contains
