schema_version: "1.0"
name: handoff-offer
description: "The engineer says to build a settled multi-unit design: the agent offers to file it as an issue, or Other, and starts nothing."
tags: [crew]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    design.md has the design we settled for the export API. Build it.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
runs: 3
graders:
  - name: crew-skill-was-loaded
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?crew\""
    min: 1
    arm: both
  - name: offers-an-issue-or-other
    type: llm
    focus: trace
    criteria: |-
      PASS when the final message offers to file the design as a GitHub issue together with an Other choice (the engineer says what instead), and then stops to wait for the answer.
      FAIL when the message starts the build, files the issue without asking, or makes no offer.
  - name: never-loads-commodore
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?commodore\""
    min: 0
    max: 0
    arm: both
  - name: never-files-an-issue
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?gh\\s+issue\\s+create"
    min: 0
    max: 0
  - name: never-launches-a-teammate
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?launch-teammate\\.sh"
    min: 0
    max: 0
  - name: never-makes-a-run-directory
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?team-init\\.sh"
    min: 0
    max: 0
  - name: never-makes-a-unit-worktree
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?unit-worktree\\.sh"
    min: 0
    max: 0
  - name: never-starts-the-handoff-from-admiral
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?(?:(?<=\")|[;&|]\\s*)admiral\\s"
    min: 0
    max: 0
