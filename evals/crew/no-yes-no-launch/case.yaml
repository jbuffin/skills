schema_version: "1.0"
name: no-yes-no-launch
description: "At a diff-review hand-off moment the agent asks which member to bring on and gets no yes in this single turn, so it launches nothing."
tags: [crew]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    Review the staged parser fix before I merge it.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion]
runs: 3
graders:
  - name: crew-skill-was-loaded
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?crew\""
    min: 1
    arm: both
  - name: asks-and-waits
    type: llm
    focus: trace
    criteria: |-
      PASS when the agent's final message asks the engineer a question before launching anything, naming a crew member that `crew.py resolve` listed (such as pr-scribe, second-eyes, scribe or reviewer) and what it would do for the review.
      FAIL when the agent launches a member, or never asks, or asks without naming a member.
  - name: never-launches-a-teammate
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?launch-teammate\\.sh"
    min: 0
    max: 0
  - name: never-makes-a-run-directory
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?team-init\\.sh"
    min: 0
    max: 0
  - name: never-makes-a-unit-worktree
    type: tool_used
    tool: Bash
    input_match: "\"command\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?unit-worktree\\.sh"
    min: 0
    max: 0
