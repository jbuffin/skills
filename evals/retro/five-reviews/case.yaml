schema_version: "1.0"
name: five-reviews
description: "Five autopilot review runs, three stopping on the same denied gh api command, one edited review: the retro proposes one allow rule and links the edited review."
tags: [retro]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    /jasonbuffin:retro github-2/prs-needs-review --dry-run --outcomes fixture/outcomes.jsonl --teams-dir fixture/teams

    When the retro is done, copy the retro.md from its run directory to fixture/final-retro.md so I can review it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: summary-table
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: '^\|[ :|-]*---'
    flags: m
    match: contains
  - name: one-proposed-allow-rule
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: '^Proposed change:[^\n]*Bash\(gh api user --jq \.login\)'
    flags: m
    match: count:1
  - name: rule-is-not-widened
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: '^Proposed change:[^\n]*\*'
    flags: m
    match: not_contains
  - name: one-finding-section
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: 'Proposed change:'
    match: count:1
  - name: edited-review-is-linked
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: '\]\(https://github\.com/example/fixture/pull/102\)'
    match: contains
  - name: retro-md-was-written
    type: file_exists
    path: '**/retro.md'
  - name: never-writes-a-config-json
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*config\.json"'
    min: 0
    max: 0
  - name: never-edits-a-config-json
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*config\.json"'
    min: 0
    max: 0
  - name: no-config-json-appears
    type: file_exists
    path: '**/config.json'
    exists: false
  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:\\n|\b)git\b(?:[^"\\;&|]|\\(?!n).)*?\bpush\b'
    min: 0
    max: 0
  - name: never-opens-a-pr
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:\\n|\b)gh\b(?:[^"\\;&|]|\\(?!n).)*?\b(?:pr\s+create\b|api\b(?:[^"\\]|\\.)*?(?:/pulls\b(?:[^"\\]|\\.)*?(?:-X|--method)[ =]*POST|(?:-X|--method)[ =]*POST(?:[^"\\]|\\.)*?/pulls\b))'
    min: 0
    max: 0
  - name: never-runs-admiral
    type: tool_used
    tool: Bash
    input_match: '(?:\\n|/bin/|\b)admiral(?:\\")?\s+(?:outcomes|config)\b'
    min: 0
    max: 0
  - name: never-writes-under-dot-admiral
    type: tool_used
    tool: Bash
    input_match: '(?:>>?|\b(?:tee|cp|mv|rm|touch|mkdir|ln|install|dd|truncate)\b|\bsed\s+-i)(?:[^"\\]|\\.)*?\.admiral/'
    min: 0
    max: 0
  - name: write-stays-in-the-run-dir
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?:(?=[^"]*\.\./)|(?![^"]*fixture/(?:teams/retro-[^"]*|final-retro\.md)"))'
    min: 0
    max: 0
  - name: edit-stays-in-the-run-dir
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?:(?=[^"]*\.\./)|(?![^"]*fixture/(?:teams/retro-[^"]*|final-retro\.md)"))'
    min: 0
    max: 0
