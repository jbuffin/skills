schema_version: "1.0"
name: five-reviews
description: "Five autopilot review runs, three stopping on the same denied gh api command, one edited review: the retro proposes one allow rule and links the edited review."
tags: [retro]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    /jasonbuffin:retro github-2/prs-needs-review --dry-run
    --outcomes fixture/outcomes.jsonl --teams-dir fixture/teams
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: summary-table
    type: regex
    target: files
    pattern: '^\|[ :|-]*---'
    flags: m
    match: contains
  - name: one-proposed-allow-rule
    type: regex
    target: files
    pattern: 'Proposed change:[\s\S]{0,300}Bash\(gh api user --jq \.login\)'
    match: count:1
  - name: rule-is-not-widened
    type: regex
    target: files
    pattern: 'Bash\(gh api user[^)]*\*'
    match: not_contains
  - name: one-finding-section
    type: regex
    target: files
    pattern: 'Proposed change:'
    match: count:1
  - name: edited-review-is-linked
    type: regex
    target: files
    pattern: '\]\(https://github\.com/example/fixture/pull/102\)'
    match: contains
  - name: retro-md-was-written
    type: file_exists
    path: '**/retro.md'
  - name: never-edits-a-config-json-with-write
    type: tool_used
    tool: Write
    input_match: 'config\.json'
    max: 0
  - name: never-edits-a-config-json-with-edit
    type: tool_used
    tool: Edit
    input_match: 'config\.json'
    max: 0
  - name: never-writes-a-config-json-from-bash
    type: tool_used
    tool: Bash
    input_match: '(>|tee|sed -i|cp|mv|rm)[^|;&]*config\.json'
    max: 0
  - name: no-config-json-appears
    type: file_exists
    path: '**/config.json'
    exists: false
  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: 'git push'
    max: 0
  - name: never-opens-a-pr
    type: tool_used
    tool: Bash
    input_match: 'gh pr create'
    max: 0
