schema_version: "1.0"
name: no-repeats
description: "Four autopilot review runs with no repeated stop and no repeated edit: the retro says no changes are proposed and opens no PR."
tags: [retro]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    /jasonbuffin:retro github-2/prs-needs-review --dry-run --outcomes fixture/outcomes.jsonl --teams-dir fixture/teams

    When the retro is done, copy the retro.md from its run directory to fixture/final-retro.md so I can review it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: says-no-changes-in-retro-md
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: '^No changes proposed\.$'
    flags: m
    match: contains
  - name: says-no-changes-to-the-engineer
    type: regex
    target: last_message
    pattern: 'no changes proposed'
    flags: i
    match: contains
  - name: no-finding-sections
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: 'Proposed change:'
    match: not_contains
  - name: retro-md-was-written
    type: file_exists
    path: '**/retro.md'
  - name: never-writes-a-config-json
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*config\.json"'
    min: 0
    max: 0
  - name: never-edits-a-config-json
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*config\.json"'
    min: 0
    max: 0
  - name: no-config-json-appears
    type: file_exists
    path: '**/config.json'
    exists: false
  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:(?:[^"\\]|\\.)*?(?:&&|;|\|\||\||\\n))?\s*git(?:\s+-C\s+\S+)?\s+push\b'
    min: 0
    max: 0
  - name: never-opens-a-pr
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:(?:[^"\\]|\\.)*?(?:&&|;|\|\||\||\\n))?\s*gh\s+pr\s+create\b'
    min: 0
    max: 0
