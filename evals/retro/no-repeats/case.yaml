schema_version: "1.0"
name: no-repeats
description: "Four autopilot review runs with no repeated stop and no repeated edit: the retro says no changes are proposed and opens no PR."
tags: [retro]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |-
    /jasonbuffin:retro github-2/prs-needs-review --dry-run --outcomes fixture/outcomes.jsonl --teams-dir fixture/teams

    When the retro is done, copy the retro.md from its run directory to fixture/final-retro.md so I can review it.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
runs: 3
graders:
  - name: says-no-changes-in-retro-md
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: '^No changes proposed\.$'
    flags: m
    match: contains
  - name: says-no-changes-to-the-engineer
    type: regex
    target: last_message
    pattern: 'no changes (are )?proposed|proposes no changes|no findings'
    flags: i
    match: contains
  - name: no-finding-sections
    type: regex
    target:
      source: file
      path: fixture/final-retro.md
    pattern: 'Proposed change:'
    match: not_contains
  - name: retro-md-was-written
    type: file_exists
    path: '**/retro.md'
  - name: never-writes-a-config-json
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*config\.json"'
    min: 0
    max: 0
  - name: never-edits-a-config-json
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*config\.json"'
    min: 0
    max: 0
  - name: no-config-json-appears
    type: file_exists
    path: '**/config.json'
    exists: false
  - name: never-pushes
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:\\n|\b)git\b(?:[^"\\;&|]|\\(?!n).)*?\bpush\b'
    min: 0
    max: 0
  - name: never-opens-a-pr
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:\\n|\b)gh\b(?:[^"\\;&|]|\\(?!n).)*?\b(?:pr\s+create\b|api\b(?:[^"\\]|\\.)*?(?:/pulls\b(?:[^"\\]|\\.)*?(?:-X|--method)[ =]*POST|(?:-X|--method)[ =]*POST(?:[^"\\]|\\.)*?/pulls\b))'
    min: 0
    max: 0
  - name: never-runs-admiral
    type: tool_used
    tool: Bash
    input_match: '(?:\\n|/bin/|\b)admiral(?:\\")?\s+(?:outcomes|config)\b'
    min: 0
    max: 0
  - name: never-writes-under-dot-admiral
    type: tool_used
    tool: Bash
    input_match: '(?:>>?|\b(?:tee|cp|mv|rm|touch|mkdir|ln|install|dd|truncate)\b|\bsed\s+-i)(?:[^"\\]|\\.)*?\.admiral/'
    min: 0
    max: 0
  - name: write-stays-in-the-run-dir
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?:(?=[^"]*\.\./)|(?![^"]*fixture/(?:teams/retro-[^"]*|final-retro\.md)"))'
    min: 0
    max: 0
  - name: edit-stays-in-the-run-dir
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?:(?=[^"]*\.\./)|(?![^"]*fixture/(?:teams/retro-[^"]*|final-retro\.md)"))'
    min: 0
    max: 0
  - name: never-clones-skills-repo
    type: tool_used
    tool: Bash
    input_match: '(?:\\n|\b)gh\s+repo\s+clone\b|(?:\\n|\b)git(?:\s+-[Cc]\s+\S+)*\s+clone\b(?:[^"\\]|\\.)*?jbuffin/skills'
    min: 0
    max: 0
  - name: never-commits
    type: tool_used
    tool: Bash
    input_match: '(?:\\n|\b)git(?:\s+-[Cc]\s+\S+)*\s+commit\b'
    min: 0
    max: 0
  - name: no-skills-clone-in-the-run-dir
    type: file_exists
    path: fixture/teams/retro-*/skills
    exists: false
